name: Publish to KDE Store

# Publishes a new package version to store.kde.org whenever a tag (v*) is pushed.
# The store (KDE/ocs-server) authenticates OCS API calls with HTTP Basic auth
# using your opendesktop account credentials — there is no API key option.
# Requires repo secrets (Settings → Secrets and variables → Actions):
#   OCS_USERNAME – your opendesktop.org / store.kde.org username
#   OCS_PASSWORD – your opendesktop.org / store.kde.org password
#   OCS_PRODUCT_ID – numeric product id from your store page URL (opendesktop.org/p/<ID>)
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build KPackage tarball
        run: |
          mkdir -p dist
          tar -cJf "dist/fork-fastfetch-splash-v${{ steps.ver.outputs.version }}.tar.xz" \
            metadata.json contents

      - name: Upload package to store.kde.org
        env:
          OCS_USERNAME: ${{ secrets.OCS_USERNAME }}
          OCS_PASSWORD: ${{ secrets.OCS_PASSWORD }}
          OCS_PRODUCT_ID: ${{ secrets.OCS_PRODUCT_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # content/uploaddownload/{id} adds a new downloadable file version
          # to the existing product. See KDE/ocs-server controllers/v1.controller.php.
          curl --fail-with-body -sS -X POST \
            -u "$OCS_USERNAME:$OCS_PASSWORD" \
            -H "OCS-APIREQUEST: true" \
            -F "localfile=@dist/fork-fastfetch-splash-v${VERSION}.tar.xz" \
            -F "version=${VERSION}" \
            -F "changelog=See https://github.com/DeadIndian/fastfetch-kde-splash/releases/tag/v${VERSION}" \
            "https://share.kde.org/ocs/v1/content/uploaddownload/${OCS_PRODUCT_ID}"

      - name: Upload tarball to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/fork-fastfetch-splash-v${{ steps.ver.outputs.version }}.tar.xz" --clobber
