name: Build Release Plasmashell

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Create plasmashell archive
        run: |
          mkdir -p fastfetch-splash/contents
          cp -r contents/* fastfetch-splash/contents/
          cp metadata.json fastfetch-splash/
          zip -r fastfetch-splash.plasmashell fastfetch-splash/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastfetch-splash
          path: fastfetch-splash.plasmashell

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: fastfetch-splash.plasmashell
          generate_release_notes: true